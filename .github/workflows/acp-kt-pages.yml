# Documentation example only. Activate in a separate reviewed workflow change.
name: Publish ACP knowledge transfer
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acp-knowledge-transfer-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/knowledge-transfer/site
      - uses: actions/deploy-pages@v4
        id: deployment
