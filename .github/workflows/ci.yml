name: CI

# Runs by itself only for main, dev/* and release/* (owner decision 2026-10-26): on code pushes to
# them (docs-only pushes are skipped) and on every pull request into them, including from forks, so
# a required check always reports. Other branches: start it from the Actions tab with "Run
# workflow". It uses no secrets and reads the repository only.
on:
  push:
    branches: [main, 'dev/**', 'release/**']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main, 'dev/**', 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # The browser end-to-end suite (Playwright, demo-mode servers and fake agents; never the real
  # `claude`), only for main: pull requests into main and pushes to it (owner decision 2026-10-26).
  e2e:
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @acp/web exec playwright install --with-deps chromium

      # The tests' own repositories commit with whatever identity git has; the runner has none.
      - name: Git identity for test repositories
        run: |
          git config --global user.name "ACP CI"
          git config --global user.email "ci@example.invalid"

      - name: End-to-end tests
        run: pnpm --filter @acp/web test:e2e

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: packages/web/test-results/
          retention-days: 7
