name: CI

# Runs by itself only for main, dev/* and release/* (owner decision 2026-10-26): on code pushes to
# them (docs-only pushes are skipped) and on every pull request into them, including from forks, so
# a required check always reports. Other branches: start it from the Actions tab with "Run
# workflow". It uses no secrets and reads the repository only.
on:
  push:
    branches: [main, 'dev/**', 'release/**']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main, 'dev/**', 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
