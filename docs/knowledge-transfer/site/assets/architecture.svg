<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1110" viewBox="0 0 1320 1110" role="img" aria-labelledby="title desc"><title id="title">ACP authorization and execution architecture</title><desc id="desc">Owner and agent requests enter a validated server boundary. The pure engine authorizes or refuses. Accepted transitions are persisted before the server performs workspace, adapter, harness and Git effects. Events return to the engine. This is a conceptual architecture view, not a sequence of every effect.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62797d"/></marker></defs><rect width="1320" height="1110" fill="#f7f7f2"/><style>text{font-family:system-ui,sans-serif;fill:#19313a}.title{font-size:20px;font-weight:700}.body{font-size:14px}.edge{fill:none;stroke:#62797d;stroke-width:2;marker-end:url(#arrow)}.label{font-size:13px;fill:#586f73}</style><path class="edge" d="M340 95 H510"/><path class="edge" d="M980 95 H810"/><path class="edge" d="M660 145 V235"/><path class="edge" d="M660 350 V420"/><path class="edge" d="M510 470 H340"/><path class="edge" d="M660 520 V585"/><path class="edge" d="M660 685 V730 H180 V775"/><path class="edge" d="M660 730 H490 V775"/><path class="edge" d="M660 730 H800 V775"/><path class="edge" d="M660 730 H1125 V775"/><path class="edge" d="M490 885 V920 H660 V960"/><path class="edge" d="M800 885 V920 H660"/><path class="edge" d="M445 1010 H15 V290 H510"/><text class="label" x="680" y="195">validated command</text><text class="label" x="400" y="452">no</text><text class="label" x="680" y="555">yes</text><text class="label" x="700" y="718">server performs permitted effects</text><text class="label" x="30" y="310">feedback</text><rect x="40" y="45" width="300" height="100" rx="12" fill="#fff" stroke="#ccd8d2"/><text class="title" x="60" y="76" style="fill:#19313a">Owner UI</text><text class="body" x="60" y="103" style="fill:#19313a">Tickets, workflow and policy</text><text class="body" x="60" y="126" style="fill:#19313a">Owner actions enter REST boundary</text><rect x="510" y="45" width="300" height="100" rx="12" fill="#fff" stroke="#ccd8d2"/><text class="title" x="530" y="76" style="fill:#19313a">Server boundary</text><text class="body" x="530" y="103" style="fill:#19313a">Validate requests and tool inputs</text><text class="body" x="530" y="126" style="fill:#19313a">Zod / CSRF where applicable</text><rect x="980" y="45" width="300" height="100" rx="12" fill="#fff" stroke="#ccd8d2"/><text class="title" x="1000" y="76" style="fill:#19313a">Lead / agent</text><text class="body" x="1000" y="103" style="fill:#19313a">Propose a task or control action</text><text class="body" x="1000" y="126" style="fill:#19313a">No authority from model confidence</text><rect x="510" y="235" width="300" height="115" rx="12" fill="#19313a" stroke="#19313a"/><text class="title" x="530" y="266" style="fill:#fff">Pure engine</text><text class="body" x="530" y="293" style="fill:#fff">State + command + policy</text><text class="body" x="530" y="316" style="fill:#fff">Capacity · phase · budget · attempts</text><rect x="40" y="420" width="300" height="100" rx="12" fill="#fff" stroke="#ccd8d2"/><text class="title" x="60" y="451" style="fill:#19313a">Refused</text><text class="body" x="60" y="478" style="fill:#19313a">Actionable typed refusal</text><text class="body" x="60" y="501" style="fill:#19313a">No launch effect</text><rect x="510" y="420" width="300" height="100" rx="12" fill="#fff" stroke="#ccd8d2"/><text class="title" x="530" y="451" style="fill:#19313a">Authorized?</text><text class="body" x="530" y="478" style="fill:#19313a">Yes: new state + declared effects</text><text class="body" x="530" y="501" style="fill:#19313a">No: typed refusal, no launch</text><rect x="510" y="585" width="300" height="100" rx="12" fill="#fff" stroke="#ccd8d2"/><text class="title" x="530" y="616" style="fill:#19313a">SQLite checkpoint</text><text class="body" x="530" y="643" style="fill:#19313a">Commit before launch effects</text><text class="body" x="530" y="666" style="fill:#19313a">Git / processes are separate systems</text><rect x="40" y="775" width="280" height="110" rx="12" fill="#fff" stroke="#ccd8d2"/><text class="title" x="60" y="806" style="fill:#19313a">Workspace + setup</text><text class="body" x="60" y="833" style="fill:#19313a">Own worktree, recorded source tip</text><text class="body" x="60" y="856" style="fill:#19313a">Trusted setup before SDK query</text><rect x="350" y="775" width="280" height="110" rx="12" fill="#fff" stroke="#ccd8d2"/><text class="title" x="370" y="806" style="fill:#19313a">Provider adapter</text><text class="body" x="370" y="833" style="fill:#19313a">Scoped tools, permission bridge</text><text class="body" x="370" y="856" style="fill:#19313a">Claude SDK today; Codex planned</text><rect x="660" y="775" width="280" height="110" rx="12" fill="#fff" stroke="#ccd8d2"/><text class="title" x="680" y="806" style="fill:#19313a">Harness evidence</text><text class="body" x="680" y="833" style="fill:#19313a">Trusted definitions and checks</text><text class="body" x="680" y="856" style="fill:#19313a">Candidate-specific results</text><rect x="970" y="775" width="310" height="110" rx="12" fill="#fff" stroke="#ccd8d2"/><text class="title" x="990" y="806" style="fill:#19313a">Server-owned Git</text><text class="body" x="990" y="833" style="fill:#19313a">Guarded integrate / promote / deliver</text><text class="body" x="990" y="856" style="fill:#19313a">Independent delivery policy</text><rect x="445" y="960" width="430" height="100" rx="12" fill="#fff" stroke="#ccd8d2"/><text class="title" x="465" y="991" style="fill:#19313a">Events and reconciliation</text><text class="body" x="465" y="1018" style="fill:#19313a">Lifecycle · usage · structured outcomes</text><text class="body" x="465" y="1041" style="fill:#19313a">Feed engine state; persist updates; UI via SSE</text></svg>